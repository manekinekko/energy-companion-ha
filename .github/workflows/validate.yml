name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Real HA runtime, configuration, lifecycle and Recorder tests
        run: sh scripts/test-ha.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && git diff --exit-code && npm test
      - run: npx playwright install --with-deps firefox
      - name: Local-only Firefox card journey
        run: |
          node scripts/serve.mjs &
          CARD_PID=$!
          trap 'kill "$CARD_PID"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8767/ > /dev/null
          npm run test:browser
