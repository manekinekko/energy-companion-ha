<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Prototype indépendant de gestion énergétique PAC, destiné à Home Assistant. Données fictives uniquement.">
  <title>Energy Assistant Lab · Démonstration Home Assistant</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <script>
    (() => {
      const explicit = new URLSearchParams(location.search).get("scoutTheme");
      let saved;
      try {
        saved = localStorage.getItem("pac-energy-theme");
        if (saved && !["light", "dark"].includes(saved)) throw new Error("Préférence invalide.");
      } catch (error) { window.themeStorageError = `Thème sauvegardé indisponible : ${error.message}`; }
      document.documentElement.dataset.theme = ["light", "dark"].includes(explicit) ? explicit :
        ["light", "dark"].includes(saved) ? saved :
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root {
      --cp-brand: color-mix(in srgb, var(--cp-danger) 50%, var(--cp-surface));
      --cp-brand-text: color-mix(in srgb, var(--cp-danger) 70%, var(--cp-text));
      --cp-brand-ink: var(--cp-text);
      --cp-brand-soft: color-mix(in srgb, var(--cp-brand) 12%, var(--cp-surface));
      --cp-brand-hover: color-mix(in srgb, var(--cp-brand) 85%, var(--cp-surface));
      --cp-page: var(--cp-bg);
      --cp-card-shadow: 0 1px 2px color-mix(in srgb, var(--cp-text) 6%, transparent);
    }
    html[data-theme="dark"] {
      --cp-brand: color-mix(in srgb, var(--cp-danger) 78%, var(--cp-text));
      --cp-brand-text: var(--cp-brand);
      --cp-brand-ink: var(--cp-accent-fg);
      --cp-page: color-mix(in srgb, var(--cp-surface) 75%, var(--cp-bg));
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--cp-page);color:var(--cp-text);font:16px/1.5 "Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif}
    button,input,select{font:inherit;color:inherit}
    button,select,input[type=checkbox],input[type=range],summary{cursor:pointer}
    button,select,input[type=number],input[type=time]{min-height:44px;border:1px solid var(--cp-border-strong);border-radius:10px;background:var(--cp-surface);padding:8px 12px;max-width:100%}
    button{transition:background .18s,border-color .18s;touch-action:manipulation}
    button:hover{background:var(--cp-brand-soft);border-color:var(--cp-brand-text)}
    button:active{background:var(--cp-brand-hover)}
    button:disabled{cursor:not-allowed;opacity:.55}
    :focus-visible{outline:3px solid var(--cp-brand-text);outline-offset:3px}
    a{color:var(--cp-brand-text)}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(28px,3vw,40px);line-height:1.15;font-weight:650;letter-spacing:-1.1px;text-wrap:balance}
    h2{font-size:20px;font-weight:650}h3{font-size:16px}
    p+p{margin-top:12px}
    .skip{position:fixed;top:-100px;padding:12px;background:var(--cp-surface);z-index:5}.skip:focus{top:8px}
    .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
    aside{background:var(--cp-bg-elevated);border-right:1px solid var(--cp-border);padding:28px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:700;font-size:19px}
    .brandmark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--cp-brand);color:var(--cp-brand-ink);flex-shrink:0}
    .brandmark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--cp-text-soft);font-weight:650}
    nav{display:grid;gap:8px}
    nav a{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px;border:1px solid var(--cp-bg-elevated);border-radius:10px;padding:11px 12px;color:var(--cp-text-soft);text-decoration:none;transition:background .18s,color .18s}
    nav a:hover{background:var(--cp-surface-soft);color:var(--cp-text)}
    nav a[aria-current=page]{background:var(--cp-brand-soft);border-color:var(--cp-border);color:var(--cp-brand-text);font-weight:650;box-shadow:inset 3px 0 var(--cp-brand)}
    svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;flex-shrink:0}
    .sidefoot{margin-top:auto;padding:12px;font-size:13px;color:var(--cp-text-soft);border-top:1px solid var(--cp-border)}
    main{min-width:0;padding:24px 32px 48px;max-width:1600px;width:100%;margin:0 auto}
    .topline{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid var(--cp-border);background:var(--cp-surface);font-size:12px;font-weight:600}
    .pill.accent{background:var(--cp-brand-soft);color:var(--cp-brand-text);border-color:var(--cp-border)}
    .heading{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px;padding:28px;border:1px solid var(--cp-border);border-radius:16px;background:var(--cp-brand-soft)}
    .heading p{margin-top:10px;color:var(--cp-text-soft);max-width:760px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .primary{background:var(--cp-brand);color:var(--cp-brand-ink);border-color:var(--cp-brand-text);font-weight:600}
    .primary:hover{background:var(--cp-brand-hover);color:var(--cp-brand-ink)}
    .grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
    .cols{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);margin-bottom:20px}
    .twocol{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px}
    .card{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:16px;padding:24px;min-width:0;box-shadow:var(--cp-card-shadow)}
    .kpis .card{border-top:3px solid var(--cp-brand)}
    .kpis .card:last-child .number{font-size:23px;letter-spacing:-.4px}
    .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .kpi-label{font-size:13px;color:var(--cp-text-soft);font-weight:600}
    .number{font-size:31px;line-height:1.3;letter-spacing:-.8px;margin-top:12px;font-variant-numeric:tabular-nums}
    .number small{font-size:15px;letter-spacing:0;color:var(--cp-text-soft)}
    .muted{color:var(--cp-text-soft)}.small{font-size:13px}.space{margin-top:16px}.spaced{margin-top:24px}
    .notice{padding:12px 16px;border-left:3px solid var(--cp-brand);background:var(--cp-brand-soft);border-radius:0 10px 10px 0;font-size:13px;margin:16px 0;color:var(--cp-text)}
    .error{color:var(--cp-danger);font-size:14px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--cp-text-soft);margin-top:12px}
    .legend span{display:flex;align-items:center;gap:6px}.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--cp-brand);border:1px solid var(--cp-brand-text)}
    .swatch.dhw{background:var(--cp-link)}.swatch.rod{background:var(--cp-warning)}
    .chart{width:100%;height:220px;display:block;overflow:visible}.chart text{fill:var(--cp-text-soft);font-size:11px;font-family:inherit}
    .chart .gridline{stroke:var(--cp-border);stroke-dasharray:3 5}.chart .heat{fill:var(--cp-brand);stroke:var(--cp-brand-text);stroke-width:.5}.chart .dhw{fill:var(--cp-link)}.chart .rod{fill:var(--cp-warning)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--cp-border)}.row:last-child{border-bottom:0}
    .row strong{font-variant-numeric:tabular-nums;white-space:nowrap}
    .bar{height:8px;border-radius:4px;background:var(--cp-surface-soft);overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:var(--cp-brand)}
    .field{display:block;margin:18px 0}.field>span:first-child{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600;margin-bottom:8px}
    .field input[type=range]{width:100%;accent-color:var(--cp-brand-text);min-height:44px;margin:0}
    .field input[type=number],.field input[type=time],.field select{width:100%}
    .field output{color:var(--cp-brand-text);font-variant-numeric:tabular-nums}
    .toggle{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 0;font-size:14px}
    input[type=checkbox]{width:20px;height:20px;accent-color:var(--cp-brand-text);flex-shrink:0}
    .toggle span{flex:1}
    .result{padding:20px;background:var(--cp-brand-soft);border-radius:10px;margin:16px 0}
    .result strong{font-size:28px;font-variant-numeric:tabular-nums}
    .metricpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    details{margin-top:16px}summary{font-size:13px;color:var(--cp-brand-text);padding:12px 0;min-height:44px}
    details p{font-size:13px;margin-top:8px;color:var(--cp-text-soft)}
    .tablewrap{overflow:auto;margin-top:12px;border:1px solid var(--cp-border);border-radius:10px}
    table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th,td{padding:10px 12px;border-bottom:1px solid var(--cp-border);white-space:nowrap}th{background:var(--cp-surface-soft);font-weight:600}tr:last-child td{border-bottom:0}
    .recommendation{padding:14px 0;border-bottom:1px solid var(--cp-border)}.recommendation:last-child{border:0}.recommendation p{font-size:13px;color:var(--cp-text-soft);margin-top:5px}
    .featurelist{display:grid;gap:12px}.feature{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--cp-border);font-size:14px}
    .feature .pill{flex-shrink:0;height:fit-content}
    .reportbody{max-width:850px;margin:auto}
    code{font:13px Consolas,"Courier New",Courier,monospace;overflow-wrap:anywhere}
    .toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:24px;z-index:10;max-width:min(440px,calc(100vw - 32px));padding:14px 20px;background:var(--cp-surface);border:1px solid var(--cp-brand-text);border-radius:10px;box-shadow:var(--cp-shadow)}
    .toast:empty{display:none}#printReport{display:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .empty{padding:24px;border:1px dashed var(--cp-border-strong);border-radius:10px;color:var(--cp-text-soft)}
    @media(max-width:1150px){.shell{grid-template-columns:200px minmax(0,1fr)}main{padding:24px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}
    @media(max-width:700px){.shell{display:block}aside{height:auto;position:static;padding:16px;border-right:0;border-bottom:1px solid var(--cp-border);gap:16px}.brand{padding:0}.sidefoot{display:none}nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}nav a{padding:8px;font-size:12px;justify-content:center;flex-direction:column;gap:4px}nav a[aria-current=page]{box-shadow:inset 0 -3px var(--cp-brand)}main{padding:20px 16px max(24px,env(safe-area-inset-bottom))}.twocol{grid-template-columns:1fr}.card{padding:16px}.kpis{gap:12px}.number{font-size:27px}.kpis .card:last-child .number{font-size:21px}.topline{align-items:flex-start}.heading{margin-bottom:20px;padding:20px}.cardhead{flex-wrap:wrap}.row{gap:8px}.feature{flex-direction:column;gap:8px}.toast{bottom:max(12px,env(safe-area-inset-bottom));right:16px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    @media print{body{background:var(--cp-surface);color:var(--cp-text)}.shell,.toast{display:none!important}#printReport{display:block;padding:12px}.card{break-inside:avoid;border-radius:0}.notice{background:none}h1{font-size:26px}.print-only-note{display:block}a{color:inherit}}
  </style>
</head>
<body>
<a class="skip" href="#content">Aller au contenu</a>
<div class="shell">
  <aside>
    <div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 18c4-9 6 9 10 0s6-9 8-6M5 10c4-9 6 9 10 0"/><path d="M5 24h18"/></svg></span><div>Energy Assistant<span class="eyebrow" style="display:block;font-size:10px;margin-top:3px">Laboratoire de confort</span></div></div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="sidefoot"><strong>Cible : Home Assistant</strong><p class="space">Données locales et fictives.<br>Aucun appareil connecté.<br>Aucune commande envoyée.</p></div>
  </aside>
  <main id="content" tabindex="-1">
    <div class="topline"><span class="pill accent">DÉMONSTRATION · DONNÉES FICTIVES</span><button id="theme" aria-label="Changer le thème">Thème</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printReport"></div>
<noscript>Ce prototype nécessite JavaScript. Aucun appareil n'est connecté.</noscript>
<script>/* MODEL */</script>
<script>/* APP */</script>
</body>
</html>
