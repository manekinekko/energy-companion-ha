<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Prototype indépendant de gestion énergétique PAC, destiné à Home Assistant. Données fictives uniquement.">
  <title>Energy Assistant Lab · Démonstration Home Assistant</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <script>
    (() => {
      const explicit = new URLSearchParams(location.search).get("scoutTheme");
      let saved;
      try {
        saved = localStorage.getItem("pac-energy-theme");
        if (saved && !["light", "dark"].includes(saved)) throw new Error("Préférence invalide.");
      } catch (error) { window.themeStorageError = `Thème sauvegardé indisponible : ${error.message}`; }
      document.documentElement.dataset.theme = ["light", "dark"].includes(explicit) ? explicit :
        ["light", "dark"].includes(saved) ? saved :
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root {
      --cp-brand: color-mix(in srgb, var(--cp-danger) 50%, var(--cp-surface));
      --cp-brand-text: color-mix(in srgb, var(--cp-danger) 70%, var(--cp-text));
      --cp-brand-ink: var(--cp-text);
      --cp-brand-soft: color-mix(in srgb, var(--cp-brand) 12%, var(--cp-surface));
      --cp-brand-hover: color-mix(in srgb, var(--cp-brand) 85%, var(--cp-surface));
      --cp-page: var(--cp-bg);
      --cp-card-shadow: 0 1px 2px color-mix(in srgb, var(--cp-text) 6%, transparent);
    }
    html[data-theme="dark"] {
      --cp-brand: color-mix(in srgb, var(--cp-danger) 78%, var(--cp-text));
      --cp-brand-text: var(--cp-brand);
      --cp-brand-ink: var(--cp-accent-fg);
      --cp-page: color-mix(in srgb, var(--cp-surface) 75%, var(--cp-bg));
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--cp-page);color:var(--cp-text);font:16px/1.5 "Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif}
    button,input,select{font:inherit;color:inherit}
    button,select,input[type=checkbox],input[type=range],summary{cursor:pointer}
    button,select,input[type=number],input[type=time]{min-height:44px;border:1px solid var(--cp-border-strong);border-radius:10px;background:var(--cp-surface);padding:8px 12px;max-width:100%}
    button{transition:background .18s,border-color .18s;touch-action:manipulation}
    button:hover{background:var(--cp-brand-soft);border-color:var(--cp-brand-text)}
    button:active{background:var(--cp-brand-hover)}
    button:disabled{cursor:not-allowed;opacity:.55}
    :focus-visible{outline:3px solid var(--cp-brand-text);outline-offset:3px}
    a{color:var(--cp-brand-text)}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(28px,3vw,40px);line-height:1.15;font-weight:650;letter-spacing:-1.1px;text-wrap:balance}
    h2{font-size:20px;font-weight:650}h3{font-size:16px}
    p+p{margin-top:12px}
    .skip{position:fixed;top:-100px;padding:12px;background:var(--cp-surface);z-index:5}.skip:focus{top:8px}
    .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
    aside{background:var(--cp-bg-elevated);border-right:1px solid var(--cp-border);padding:28px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-weight:700;font-size:19px}
    .brandmark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--cp-brand);color:var(--cp-brand-ink);flex-shrink:0}
    .brandmark svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--cp-text-soft);font-weight:650}
    nav{display:grid;gap:8px}
    nav a{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px;border:1px solid var(--cp-bg-elevated);border-radius:10px;padding:11px 12px;color:var(--cp-text-soft);text-decoration:none;transition:background .18s,color .18s}
    nav a:hover{background:var(--cp-surface-soft);color:var(--cp-text)}
    nav a[aria-current=page]{background:var(--cp-brand-soft);border-color:var(--cp-border);color:var(--cp-brand-text);font-weight:650;box-shadow:inset 3px 0 var(--cp-brand)}
    svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;flex-shrink:0}
    .sidefoot{margin-top:auto;padding:12px;font-size:13px;color:var(--cp-text-soft);border-top:1px solid var(--cp-border)}
    main{min-width:0;padding:24px 32px 48px;max-width:1600px;width:100%;margin:0 auto}

    .pill{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid var(--cp-border);background:var(--cp-surface);font-size:12px;font-weight:600}

    .heading{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px;padding:28px;border:1px solid var(--cp-border);border-radius:16px;background:var(--cp-brand-soft)}
    .heading p{margin-top:10px;color:var(--cp-text-soft);max-width:760px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .primary{background:var(--cp-brand);color:var(--cp-brand-ink);border-color:var(--cp-brand-text);font-weight:600}
    .primary:hover{background:var(--cp-brand-hover);color:var(--cp-brand-ink)}
    .grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
    .cols{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);margin-bottom:20px}
    .twocol{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px}
    .card{background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:16px;padding:24px;min-width:0;box-shadow:var(--cp-card-shadow)}
    .kpis .card{border-top:3px solid var(--cp-brand)}
    .kpis .card:last-child .number{font-size:23px;letter-spacing:-.4px}
    .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .kpi-label{font-size:13px;color:var(--cp-text-soft);font-weight:600}
    .number{font-size:31px;line-height:1.3;letter-spacing:-.8px;margin-top:12px;font-variant-numeric:tabular-nums}
    .number small{font-size:15px;letter-spacing:0;color:var(--cp-text-soft)}
    .muted{color:var(--cp-text-soft)}.small{font-size:13px}.space{margin-top:16px}.spaced{margin-top:24px}
    .notice{padding:12px 16px;border-left:3px solid var(--cp-brand);background:var(--cp-brand-soft);border-radius:0 10px 10px 0;font-size:13px;margin:16px 0;color:var(--cp-text)}
    .error{color:var(--cp-danger);font-size:14px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--cp-text-soft);margin-top:12px}
    .legend span{display:flex;align-items:center;gap:6px}.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--cp-brand);border:1px solid var(--cp-brand-text)}
    .swatch.dhw{background:var(--cp-link)}.swatch.rod{background:var(--cp-warning)}
    .chart{width:100%;height:220px;display:block;overflow:visible}.chart text{fill:var(--cp-text-soft);font-size:11px;font-family:inherit}
    .chart .gridline{stroke:var(--cp-border);stroke-dasharray:3 5}.chart .heat{fill:var(--cp-brand);stroke:var(--cp-brand-text);stroke-width:.5}.chart .dhw{fill:var(--cp-link)}.chart .rod{fill:var(--cp-warning)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--cp-border)}.row:last-child{border-bottom:0}
    .row strong{font-variant-numeric:tabular-nums;white-space:nowrap}
    .bar{height:8px;border-radius:4px;background:var(--cp-surface-soft);overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:var(--cp-brand)}
    .field{display:block;margin:18px 0}.field>span:first-child{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600;margin-bottom:8px}
    .field input[type=range]{width:100%;accent-color:var(--cp-brand-text);min-height:44px;margin:0}
    .field input[type=number],.field input[type=time],.field select{width:100%}
    .field output{color:var(--cp-brand-text);font-variant-numeric:tabular-nums}
    .toggle{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 0;font-size:14px}
    input[type=checkbox]{width:20px;height:20px;accent-color:var(--cp-brand-text);flex-shrink:0}
    .toggle span{flex:1}
    .result{padding:20px;background:var(--cp-brand-soft);border-radius:10px;margin:16px 0}
    .result strong{font-size:28px;font-variant-numeric:tabular-nums}
    .metricpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    details{margin-top:16px}summary{font-size:13px;color:var(--cp-brand-text);padding:12px 0;min-height:44px}
    details p{font-size:13px;margin-top:8px;color:var(--cp-text-soft)}
    .tablewrap{overflow:auto;margin-top:12px;border:1px solid var(--cp-border);border-radius:10px}
    table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th,td{padding:10px 12px;border-bottom:1px solid var(--cp-border);white-space:nowrap}th{background:var(--cp-surface-soft);font-weight:600}tr:last-child td{border-bottom:0}
    .recommendation{padding:14px 0;border-bottom:1px solid var(--cp-border)}.recommendation:last-child{border:0}.recommendation p{font-size:13px;color:var(--cp-text-soft);margin-top:5px}
    .featurelist{display:grid;gap:12px}.feature{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--cp-border);font-size:14px}
    .feature .pill{flex-shrink:0;height:fit-content}
    .reportbody{max-width:850px;margin:auto}
    code{font:13px Consolas,"Courier New",Courier,monospace;overflow-wrap:anywhere}
    .toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:24px;z-index:10;max-width:min(440px,calc(100vw - 32px));padding:14px 20px;background:var(--cp-surface);border:1px solid var(--cp-brand-text);border-radius:10px;box-shadow:var(--cp-shadow)}
    .toast:empty{display:none}#printReport{display:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .empty{padding:24px;border:1px dashed var(--cp-border-strong);border-radius:10px;color:var(--cp-text-soft)}
    @media(max-width:1150px){.shell{grid-template-columns:200px minmax(0,1fr)}main{padding:24px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}
    @media(max-width:700px){.shell{display:block}aside{height:auto;position:static;padding:16px;border-right:0;border-bottom:1px solid var(--cp-border);gap:16px}.brand{padding:0}.sidefoot{display:none}nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}nav a{padding:8px;font-size:12px;justify-content:center;flex-direction:column;gap:4px}nav a[aria-current=page]{box-shadow:inset 0 -3px var(--cp-brand)}main{padding:20px 16px max(24px,env(safe-area-inset-bottom))}.twocol{grid-template-columns:1fr}.card{padding:16px}.kpis{gap:12px}.number{font-size:27px}.kpis .card:last-child .number{font-size:21px}.topline{align-items:flex-start}.heading{margin-bottom:20px;padding:20px}.cardhead{flex-wrap:wrap}.row{gap:8px}.feature{flex-direction:column;gap:8px}.toast{bottom:max(12px,env(safe-area-inset-bottom));right:16px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    @media print{body{background:var(--cp-surface);color:var(--cp-text)}.shell,.toast{display:none!important}#printReport{display:block;padding:12px}.card{break-inside:avoid;border-radius:0}.notice{background:none}h1{font-size:26px}.print-only-note{display:block}a{color:inherit}}
  </style>
</head>
<body>
<a class="skip" href="#content">Aller au contenu</a>
<div class="shell">
  <aside>
    <div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 18c4-9 6 9 10 0s6-9 8-6M5 10c4-9 6 9 10 0"/><path d="M5 24h18"/></svg></span><div>Energy Assistant<span class="eyebrow" style="display:block;font-size:10px;margin-top:3px">Laboratoire de confort</span></div></div>
    <nav id="nav" aria-label="Navigation principale"></nav>
    <div class="sidefoot"><strong>Cible : Home Assistant</strong><p class="space">Données locales et fictives.<br>Aucun appareil connecté.<br>Aucune commande envoyée.</p></div>
  </aside>
  <main id="content" tabindex="-1">
    <div class="topline"><span class="pill accent">DÉMONSTRATION · DONNÉES FICTIVES</span><button id="theme" aria-label="Changer le thème">Thème</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printReport"></div>
<noscript>Ce prototype nécessite JavaScript. Aucun appareil n'est connecté.</noscript>
<script>(function (root) {
  'use strict';
  const defaults = {
    version: 1, price: 0.2516, days: 30, category: 'total',
    smartClimate: true, emitter: 'floor', geofencing: true,
    lowerAway: true, stopLoop: true, absenceHours: 2,
    ihc: true, preheat: true, windowDetection: true,
    people: [{ name: 'Camille', home: true }, { name: 'Alex', home: false }],
    rooms: [
      { name: 'Séjour', temperature: 19.4, target: 20, windowUntil: 0 },
      { name: 'Bureau', temperature: 19.2, target: 20, windowUntil: 0 },
      { name: 'Chambre', temperature: 18.5, target: 19, windowUntil: 0 }
    ],
    clock: 360, arrival: 420, slope: 0.8, level: 0,
    curveVariant: 'standard', curveRoom: 20,
    dhwTemperature: 52, dhwHours: 8, volume: 120, dhwCop: 2.8,
    history: [], month: '2026-08'
  };
  function fresh() { return JSON.parse(JSON.stringify(defaults)); }
  function finite(value, min, max, name) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < min || value > max)
      throw new Error(`${name} doit être compris entre ${min} et ${max}.`);
    return value;
  }
  function validate(input) {
    if (!input || typeof input !== 'object' || input.version !== 1)
      throw new Error('Format de scénario non reconnu.');
    const s = fresh();
    const ranges = {
      price: [0, 2], absenceHours: [0, 72], clock: [0, 1000000], arrival: [0, 1439],
      slope: [0.2, 1.6], level: [-5, 5], dhwTemperature: [50, 60],
      dhwHours: [1, 24], volume: [50, 300], dhwCop: [1, 5]
    };
    for (const [key, range] of Object.entries(ranges))
      s[key] = finite(input[key], ...range, key);
    if (![7, 30, 90].includes(input.days)) throw new Error('Période non reconnue.');
    s.days = input.days;
    for (const key of ['smartClimate', 'geofencing', 'lowerAway', 'stopLoop', 'ihc', 'preheat', 'windowDetection']) {
      if (typeof input[key] !== 'boolean') throw new Error(`Valeur invalide : ${key}.`);
      s[key] = input[key];
    }
    if (!['floor', 'radiator'].includes(input.emitter)) throw new Error('Émetteur non reconnu.');
    s.emitter = input.emitter;
    if (!['total', 'heating', 'dhw', 'rod'].includes(input.category)) throw new Error('Usage non reconnu.');
    s.category = input.category;
    const variant = input.curveVariant === undefined ? 'standard' : input.curveVariant;
    if (!['standard', 'legacy-pac-0'].includes(variant)) throw new Error('Variante de courbe non reconnue.');
    s.curveVariant = variant;
    s.curveRoom = input.curveRoom === undefined ? 20 : finite(input.curveRoom, 16, 23, 'Consigne de courbe');
    if (!/^2026-0[1-8]$/.test(input.month)) throw new Error('Mois de démonstration non reconnu.');
    s.month = input.month;
    if (!Array.isArray(input.people) || input.people.length !== 2) throw new Error('Deux profils fictifs requis.');
    s.people = input.people.map((p, i) => {
      if (typeof p.home !== 'boolean') throw new Error('Présence invalide.');
      return { name: defaults.people[i].name, home: p.home };
    });
    if (!Array.isArray(input.rooms) || input.rooms.length !== 3) throw new Error('Trois pièces requises.');
    s.rooms = input.rooms.map((r, i) => ({
      name: defaults.rooms[i].name,
      temperature: finite(r.temperature, 10, 30, 'Température'),
      target: finite(r.target, 16, 23, 'Consigne'),
      windowUntil: finite(r.windowUntil, 0, 1000000, 'Fin de fenêtre')
    }));
    if (!Array.isArray(input.history) || input.history.length > 100) throw new Error('Historique invalide.');
    s.history = input.history.map(h => {
      if (!h || typeof h.text !== 'string' || h.text.length > 180 || typeof h.at !== 'string' || h.at.length > 40)
        throw new Error('Entrée historique invalide.');
      return { text: h.text, at: h.at };
    });
    return s;
  }
  function demand(outside, day = 0) {
    const thermalHeating = Math.max(0, 19 - outside) * 3.4;
    const rod = thermalHeating * (outside < 3 ? 0.085 : 0.012);
    const copHeating = Math.max(2.3, Math.min(4.8, 3.3 + outside * 0.065));
    const heating = (thermalHeating - rod) / copHeating;
    const thermalDhw = 6.8 + Math.sin(day * 1.4) * 0.5;
    const dhw = thermalDhw / 2.8;
    return { heating, dhw, rod, total: heating + dhw + rod, thermal: thermalHeating + thermalDhw };
  }
  const data = Array.from({ length: 265 }, (_, i) => {
    const date = new Date(Date.UTC(2026, 0, i + 1)).toISOString().slice(0, 10);
    const outside = 12 - 8 * Math.cos(2 * Math.PI * (i - 15) / 365) + 2 * Math.sin(i * 0.7);
    return { date, outside, ...demand(outside, i) };
  });
  function summarize(rows, price) {
    const out = { heating: 0, dhw: 0, rod: 0, total: 0, thermal: 0, outside: 0, count: rows.length };
    for (const row of rows) for (const key of ['heating', 'dhw', 'rod', 'total', 'thermal', 'outside']) out[key] += row[key];
    out.outside = rows.length ? out.outside / rows.length : null;
    out.cop = out.total > 0 ? out.thermal / out.total : null;
    out.cost = out.total * price;
    out.savings = null;
    return out;
  }
  function compare(current, baseline) { return baseline > 0 ? (current - baseline) / baseline * 100 : null; }
  function dhw(s) {
    const electrical = (temperature, hours) => (
      s.volume * 0.001163 * (temperature - 12) +
      1.8 * ((temperature - 20) / 35) * hours / 24
    ) / s.dhwCop;
    const before = electrical(55, 16.5) * 365;
    const after = electrical(s.dhwTemperature, s.dhwHours) * 365;
    return { before, after, saved: before - after, cost: after * s.price, savedCost: (before - after) * s.price };
  }
  function curve(outside, slope, level, options = {}) {
    const room = options.room === undefined ? 20 : options.room;
    const minimum = options.minimum === undefined ? 20 : options.minimum;
    const maximum = options.maximum === undefined ? 55 : options.maximum;
    const variant = options.variant === undefined ? 'standard' : options.variant;
    finite(outside, -60, 60, 'Température extérieure');
    finite(room, 5, 30, 'Consigne ambiante');
    finite(slope, 0, 4, 'Pente');
    finite(level, -20, 40, 'Niveau');
    finite(minimum, 0, 100, 'Départ minimal');
    finite(maximum, minimum, 100, 'Départ maximal');
    if (!['standard', 'legacy-pac-0'].includes(variant)) throw new Error('Variante de courbe non reconnue.');
    // Preserve the single-precision operations and rounding of the client chart.

      `<div class="grid twocol"><section class="card"><div class="cardhead"><h2>Présence et géofencing</h2><span class="pill">${a.away ? 'Tous absents' : 'À la maison'}</span></div>
      ${state.people.map((p, i) => `<div class="row"><div><strong>${p.name}</strong><div class="small muted">Profil fictif ${i + 1}</div></div><button data-person="${i}" aria-pressed="${p.home}">${p.home ? 'À la maison' : 'Absent'}</button></div>`).join('')}
      ${toggle('geofencing', 'Activer le géofencing simulé')}${toggle('lowerAway', 'Abaisser les consignes de 1 °C', 'Uniquement après une absence suffisamment longue.')}${toggle('stopLoop', 'Arrêter le bouclage ECS en absence', 'Ne concerne pas le circulateur du chauffage.')}
      ${slider('absenceHours', 'Durée d’absence supposée', 0, 24, 0.5, 'h')}
      <div class="result"><strong style="font-size:20px">${!state.geofencing ? 'Programme normal' : a.reduce ? 'Abaissement de 1 °C simulé' : a.away ? 'Programme maintenu' : 'Programme de présence'}</strong><p class="small space">${a.away && !a.reduce && state.geofencing ? `Le garde-fou de ce prototype attend ${a.minHours} h pour cet émetteur.` : 'Le retour d’un seul occupant suffit à rétablir le programme.'}</p></div>
      <div class="row"><span>Bouclage ECS</span><strong>${a.loopOff ? 'Arrêt simulé' : 'Normal'}</strong></div>
      <p class="small muted space">Le web seul ne garantit pas le GPS en arrière-plan. La cible HA utilisera des entités de présence autorisées.</p></section>
      <section class="card"><h2>Régulation et anticipation</h2>
      ${toggle('smartClimate', 'Capteurs de pièces connectés', 'Désactive-les pour tester les prérequis matériels.')}
      <label class="field"><span>Type d’émetteur</span><select id="emitter" data-set="emitter"><option value="floor" ${state.emitter === 'floor' ? 'selected' : ''}>Plancher chauffant</option><option value="radiator" ${state.emitter === 'radiator' ? 'selected' : ''}>Radiateurs</option></select></label>
      ${toggle('ihc', 'Contrôle intelligent illustratif', 'Demande de pièces et température de départ.', !state.smartClimate)}
      ${toggle('preheat', 'Anticiper l’heure de confort', '120 min/°C pour le plancher, 60 min/°C pour les radiateurs.', !state.smartClimate)}
      ${toggle('windowDetection', 'Simuler la détection de fenêtre', 'Pause de demande pendant 30 min d’horloge démo.', !state.smartClimate)}
      <label class="field"><span>Heure de confort souhaitée</span><input id="arrival" data-set="arrival" data-type="time" type="time" required value="${time(state.arrival)}"></label>
      <div class="result"><div class="small">Départ illustratif · extérieur fictif 8 °C</div><strong>${n(a.supply)} °C</strong><p class="small">${a.optimized ? 'Modulation pédagogique non validée' : 'Formule de tracé seule'} · référence ${n(a.baseFlow)} °C</p></div>
      <details><summary>Modèles utilisés, pas un régulateur réel</summary><p>Demande de pièce = écart de température positif × 70, limité à 100 %. Le départ illustratif vaut min(courbe de référence ; 25 + demande maximale × 0,15), avec une limite basse de 20 °C. L’anticipation utilise un délai fixe par degré, sans apprentissage réel.</p><p>Ces lois ne conviennent pas au pilotage direct d’une installation. La version HA devra gérer le débit, l’antigel, les cycles et les limites constructeur.</p></details></section></div>
      <section class="card"><div class="cardhead"><h2>Pièces et événements</h2><span class="pill">${state.smartClimate ? 'Capteurs simulés' : 'Accessoires absents'}</span></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${a.rooms.map((r, i) => `<article class="card" style="background:var(--cp-surface-soft)"><h3>${r.name}</h3><div class="number">${n(r.temperature)} <small>°C fictifs</small></div><label class="field"><span>Consigne nominale</span><input id="room-${i}" data-room="${i}" type="number" min="16" max="23" step="0.5" value="${state.rooms[i].target}"></label><p class="small">Consigne effective : ${n(r.target)} °C<br>Demande simulée : ${r.demand} %</p><p class="small muted space">${r.window ? `Fenêtre détectée, pause jusqu’à ${time(r.windowUntil)}` : r.minutes ? `Préchauffage : ${time(r.start)}, avance ${r.minutes} min${r.preheating ? ' · actif à l’horloge démo' : ''}` : 'Préchauffage non requis ou désactivé'}</p><button class="space" data-window="${i}" ${!state.smartClimate || !state.windowDetection ? 'disabled' : ''}>${r.window ? 'Terminer l’aération' : 'Simuler une fenêtre ouverte'}</button></article>`).join('')}</div>
      <div class="notice">Il s’agit d’une pause de demande simulée, pas d’une fermeture de vanne. La version réelle doit préserver le débit minimal de la PAC.</div></section>`;
  }
  function reportMarkup(month) {
    const rows = M.monthly(month), t = M.summarize(rows, state.price);
    const label = new Date(`${month}-01T12:00:00Z`).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    return `<article class="reportbody"><div class="eyebrow">Energy Assistant Lab · Rapport de démonstration</div><h1 class="space">${esc(label)}</h1><p class="muted space">Données entièrement fictives. Document indépendant généré localement.</p><div class="notice">Ce document ne prouve aucune consommation réelle, économie ou performance d’une installation.</div>
      <div class="grid twocol">${kpi('Électricité', n(t.total), 'kWh', `${rows.length} jours fictifs`)}${kpi('Coût du scénario', money(t.cost), '', `${n(state.price * 100)} centimes/kWh, hors abonnement`)}${kpi('Chaleur produite', n(t.thermal), 'kWh', 'Modèle thermique pédagogique')}${kpi('COP de période', n(t.cop), '', 'Inclut l’appoint, ne vaut pas SCOP')}</div>
      <h2>Répartition électrique</h2><div class="row"><span>Compresseur chauffage</span><strong>${n(t.heating)} kWh</strong></div><div class="row"><span>ECS</span><strong>${n(t.dhw)} kWh</strong></div><div class="row"><span>Appoint</span><strong>${n(t.rod)} kWh</strong></div>
      <h2 class="spaced">Méthode et limites</h2><p class="small space">Historique synthétique généré par une fonction déterministe. Le coût applique le tarif courant du scénario à tout le mois, pas un tarif historique. Le COP est le rapport entre chaleur totale et électricité totale. Les réglages des simulateurs n’altèrent pas cet historique.</p>
      <h2 class="spaced">Valeurs quotidiennes</h2>${table(rows)}</article>`;
  }
  function reports() {
    return heading('Un bilan que tu peux conserver.', 'Génère un rapport mensuel fictif, puis imprime-le ou enregistre-le en PDF depuis le navigateur.') +
      `<section class="card"><div class="cardhead"><label>Mois complet <select id="month" data-set="month">${Array.from({ length: 8 }, (_, i) => {
        const value = `2026-${String(i + 1).padStart(2, '0')}`;
        return `<option value="${value}" ${state.month === value ? 'selected' : ''}>${new Date(`${value}-01T12:00:00Z`).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' })}</option>`;
      }).join('')}</select></label><div class="actions"><button class="primary" data-action="generate">Générer le rapport</button><button data-action="print" ${generatedMonth ? '' : 'disabled'}>Imprimer / PDF</button><button data-action="month-csv">CSV du mois</button></div></div><p class="small muted">Les mois proposés sont complets dans le jeu de données fictif. Les hypothèses de calcul sont documentées séparément.</p></section>
      <section class="card spaced" id="generatedReport">${generatedMonth ? reportMarkup(generatedMonth) : '<p class="empty">Choisis un mois et génère le bilan. Aucun service distant n’est appelé.</p>'}</section>`;
  }
  function homeassistant() {
    const features = [
      ['Rapports, comparaison et prévision', 'Simulés', 'Calculs déterministes et exports locaux.'],
      ['Calculateur ECS', 'Estimation locale', 'Modèle simplifié non validé, hypothèses visibles.'],
      ['Économies attribuables aux automatismes', 'Non calculées', 'Référence personnalisée indisponible. Aucun pourcentage forfaitaire.'],
      ['Tracé de courbe de chauffe', 'Formule vérifiée', 'Deux profils de visualisation, bornes de démonstration. Aucune commande.'],
      ['Préchauffage et modulation du départ', 'Simulés', 'Règles pédagogiques non validées pour le pilotage réel.'],
      ['Géofencing et fenêtres', 'Simulés', 'Présence et événements manuels, pas de collecte GPS.'],
      ['Famille et amis', 'Profils fictifs', 'Aucune authentification ou invitation réelle.'],
      ['Connexion Home Assistant', 'À développer', 'Entités et API non connectées dans ce prototype.'],
      ['Tarification dynamique et hystérésis ECS', 'Hors périmètre', 'Aucune optimisation horaire des tarifs ni modification d’hystérésis.']
    ];
    return heading('Pensé pour Home Assistant.', 'Cette première version valide les interactions. Le déploiement final se fera dans HA, après raccordement aux entités réelles.') +
      `<div class="grid twocol"><section class="card"><h2>Paramètres de démonstration</h2><label class="field"><span>Prix de l’électricité, EUR/kWh</span><input id="price" data-set="price" data-type="number" type="number" min="0" max="2" step="0.0001" value="${state.price}"></label><p class="small muted">Recalcule les coûts du scénario sur toute la période. Ce n’est pas une tarification historique.</p><div class="actions space"><button data-action="export">Exporter le scénario JSON</button><button data-action="import">Importer un scénario</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><button class="space" data-action="reset">Réinitialiser la démonstration</button><p class="small muted space">Les paramètres sont conservés dans ce navigateur. Aucune donnée personnelle ni clé API n’est demandée.</p></section>
      <section class="card"><h2>Contrat d’intégration prévu</h2><div class="row"><span>Interface</span><strong>Lovelace</strong></div><div class="row"><span>Authentification</span><strong>Session HA</strong></div><div class="row"><span>Historique</span><strong>Statistiques HA</strong></div><div class="row"><span>Exécution automatique</span><strong>Côté HA</strong></div><div class="notice">Pas de déploiement effectué. Aucune entité détectée ou inventée. Les modèles et protections doivent être validés avant tout pilotage.</div><p class="small muted">Sources à raccorder : énergie électrique, chaleur produite, température extérieure, climat, eau chaude, présence et capteurs de pièces. Les fonctions absentes devront être marquées indisponibles.</p></section></div>
      <section class="card"><h2>Couverture fonctionnelle et limites</h2><div class="featurelist space">${features.map(([label, status, desc]) => `<div class="feature"><div><strong>${label}</strong><p class="small muted">${desc}</p></div><span class="pill">${status}</span></div>`).join('')}</div><a href="methodologie-calculs.md" download class="space" style="display:inline-block">Télécharger la méthodologie des calculs</a></section>`;
  }
  function render() {
    const focused = document.activeElement?.id;
    document.getElementById('nav').innerHTML = Object.entries(tabs).map(([key, label]) => `<a href="#${key}" data-go="${key}" ${current === key ? 'aria-current="page"' : ''}>${icon(key)}${label}</a>`).join('');
    document.getElementById('view').innerHTML = ({ overview, analysis, simulation, automation, reports, homeassistant })[current]();
    if (focused) document.getElementById(focused)?.focus({ preventScroll: true });
    document.getElementById('theme').textContent = document.documentElement.dataset.theme === 'dark' ? 'Mode clair' : 'Mode sombre';
  }
  function download(text, filename, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notify(`${filename} exporté. Données de démonstration uniquement.`);
  }
  function navigate(tab) {
    if (!Object.hasOwn(tabs, tab)) return;
    if (location.hash === `#${tab}`) { current = tab; render(); }
    else location.hash = tab;
  }
  window.addEventListener('hashchange', () => {
    const tab = location.hash.slice(1);
    current = Object.hasOwn(tabs, tab) ? tab : 'overview';
    render();
    document.getElementById('content').focus({ preventScroll: true });
  });
  document.addEventListener('input', event => {
    const element = event.target;
    if (element.matches('input[type=range][data-set]')) {
      const out = document.getElementById(`${element.dataset.set}Out`);
      if (out) out.textContent = `${n(Number(element.value))} ${element.dataset.unit || ''}`;
    }
  });
  document.addEventListener('change', async event => {
    const el = event.target;
    if (el.id === 'importFile') {
      const file = el.files[0];
      if (!file) return;
      try {
        if (file.size > 100000) throw new Error('Fichier trop volumineux (maximum 100 Ko).');
        state = M.validate(JSON.parse(await file.text()));
        generatedMonth = null; save(); render(); notify('Scénario importé. Aucune connexion externe.');
      } catch (error) { notify(`Import refusé : ${error.message}`); }
      return;
    }
    if (!el.dataset.set && el.dataset.room === undefined) return;
    if (!el.checkValidity() || (el.type === 'number' && el.value.trim() === '')) {
      el.setCustomValidity('Saisis une valeur dans les limites indiquées.');
      el.reportValidity();
      el.addEventListener('input', () => el.setCustomValidity(''), { once: true });
      return;
    }
    try {
      const next = JSON.parse(JSON.stringify(state));
      if (el.dataset.room !== undefined) next.rooms[Number(el.dataset.room)].target = Number(el.value);
      else {
        let value = el.type === 'checkbox' ? el.checked : el.value;
        if (el.dataset.type === 'number') value = Number(el.value);
        if (el.dataset.type === 'time') { const [h, m] = el.value.split(':').map(Number); value = h * 60 + m; }
        next[el.dataset.set] = value;
      }
      state = M.validate(next);
      if (el.dataset.set === 'month' || el.dataset.set === 'price') generatedMonth = null;
      save(); render();
    } catch (error) { notify(error.message); render(); }
  });
  document.addEventListener('click', event => {
    const el = event.target.closest('button');
    if (!el || el.disabled) return;
    if (el.id === 'theme') {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('pac-energy-theme', document.documentElement.dataset.theme); }
      catch (error) { notify(`Thème non mémorisé : ${error.message}`); }
      const url = new URL(location.href);
      if (url.searchParams.has('scoutTheme')) {
        url.searchParams.set('scoutTheme', document.documentElement.dataset.theme);
        window.history.replaceState(null, '', url);
      }
      render(); return;
    }
    if (el.dataset.go) { navigate(el.dataset.go); return; }
    if (el.dataset.person !== undefined) {
      const person = state.people[Number(el.dataset.person)]; person.home = !person.home;
      log(`${person.name} : ${person.home ? 'retour simulé' : 'départ simulé'}`);
    } else if (el.dataset.window !== undefined) {
      const room = state.rooms[Number(el.dataset.window)];
      room.windowUntil = room.windowUntil > state.clock ? 0 : state.clock + 30;
      log(`${room.name} : ${room.windowUntil ? 'aération simulée pendant 30 min' : 'fin de l’aération'}`);
    } else {
      switch (el.dataset.action) {
        case 'csv': download(M.csv(M.data.slice(-state.days), state.price), 'pac-energie-demo.csv', 'text/csv;charset=utf-8'); return;
        case 'month-csv': download(M.csv(M.monthly(state.month), state.price), `pac-demo-${state.month}.csv`, 'text/csv;charset=utf-8'); return;
        case 'export': download(JSON.stringify(state, null, 2), 'pac-scenario-demo.json', 'application/json'); return;
        case 'import': document.getElementById('importFile').click(); return;
        case 'generate': generatedMonth = state.month; notify('Rapport mensuel fictif généré localement.'); break;
        case 'print':
          if (!generatedMonth) return;
          document.getElementById('printReport').innerHTML = reportMarkup(generatedMonth);
          window.print(); return;
        case 'advance': state.clock += 15; log(`Horloge avancée à ${time(state.clock)}`); break;
        case 'record-dhw': log(`ECS : ${state.dhwTemperature} °C, ${state.dhwHours} h, écart simulé ${money(M.dhw(state).savedCost)}/an`); notify('Scénario conservé localement. Aucune consigne envoyée.'); break;
        case 'comfort': log(`Confort déclaré satisfaisant : pente ${state.slope}, niveau ${state.level}`); notify('Retour de confort ajouté au journal local.'); break;
        case 'cold': state.slope = 0.8; state.level = 0; log('Trop froid : paramètres de courbe restaurés à 0,8 / 0'); break;
        case 'reset-curve': state.slope = 0.8; state.level = 0; state.curveRoom = 20; state.curveVariant = 'standard'; log('Courbe réinitialisée au profil standard'); break;
        case 'reset':
          if (!window.confirm('Réinitialiser uniquement les données de démonstration de ce navigateur ?')) return;
          state = M.fresh(); generatedMonth = null; notify('Démonstration réinitialisée.'); break;
        default: return;
      }
    }
    save(); render();
  });
  render();
  if (loadError || window.themeStorageError) notify([loadError, window.themeStorageError].filter(Boolean).join(' '));
})();
</script>
</body>
</html>
